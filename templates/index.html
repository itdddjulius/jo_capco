<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>
        RAGBot - Capco – AI Engineer Coding Task
    </title>

    <!-- ==================== BOOTSTRAP ==================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- ==================== CUSTOM CSS ==================== -->

    <style>


    </style>

</head>

<body>

    <!-- ==================== MAIN WRAPPER ==================== -->

    <div class="main-wrapper">

        <div class="content-box">

            <!-- ==================== TITLE ==================== -->

            <h1 class="header-title">
                RAGBot - Capco – AI Engineer Coding Task
            </h1>

            <!-- ==================== QUESTION FORM ==================== -->

            <form
                action="/ask"
                method="post"
                class="question-form"
            >

                <textarea
                    name="question"
                    rows="2"
                    placeholder="Ask a question..."
                    required
                ></textarea>

                <center>

                    <button
                        type="submit"
                        class="btn-ask"
                    >
                        Ask Question
                    </button>

                </center>

            </form>

            <!-- ==================== ANSWER SECTION ==================== -->

            <div class="answer-box">

                <div class="answer-title">
                    ANSWER
                </div>

                <div id="answer-content">

                    <iframe
                        id="answer-iframe"
                        src="/answer"
                    ></iframe>

                </div>

            </div>

        </div>

    </div>

    <!-- ==================== FOOTER ==================== -->

    <footer>

        <div class="footer-menu">

            <button
                type="button"
                data-bs-toggle="modal"
                data-bs-target="#contactModal"
            >
                CONTACT
            </button>

        </div>

        <p>

            Another Website by

            <a
                href="https://raiiarcomio.com"
                target="_blank"
            >
                Julius Olatokunbo
            </a>

        </p>

    </footer>

    <!-- ==================== CONTACT MODAL ==================== -->

    <div
        class="modal fade"
        id="contactModal"
        tabindex="-1"
        aria-hidden="true"
    >

        <div
            class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable"
        >

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        CONTACT
                    </h5>

                    <button
                        type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal"
                    ></button>

                </div>

                <div class="modal-body">

                    <iframe
                        class="contact-iframe"
                        src="https://raiiarcomio.com/contact2"
                    ></iframe>

                </div>

            </div>

        </div>

    </div>

    <!-- ==================== SCRIPTS ==================== -->

    <script src="/static/js/app.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
